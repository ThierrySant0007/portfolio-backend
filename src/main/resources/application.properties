# Server
server.port=8080

# MySQL Database Configuration
# ATENCAO: Certifique-se de que o banco de dados 'portfolio_db' exista no seu MySQL e que as credenciais abaixo estejam corretas.
spring.datasource.url=jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=

# Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
